name: now_playing
description: VYBE, a now playing screen for Android car head units.
publish_to: 'none'
version: 1.9.9+32

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.0
  path_provider: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/vybe_icon.png
    - assets/vybe_logo.png
    - assets/vybe_edgy_logo.svg
    - assets/vybe_edgy_icon.svg
    - assets/vybe_splash_portrait.png
    - assets/vybe_splash_landscape.png
    - assets/theme_previews/
  shaders:
    - shaders/vybe_refraction.frag
    - shaders/golden_hour.frag
    - shaders/neon_ribbons.frag
    - shaders/club_stage.frag
    - shaders/lightstorm.frag
    - shaders/neon_club.frag
