name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the standard Gradle/icon scaffolding, but never overwrite
      # the files in this repo (pubspec, lib/, manifest, Kotlin).
      - name: Generate Flutter scaffolding
        run: |
          flutter create --org com.conjure --project-name now_playing /tmp/scaffold
          cp -rn /tmp/scaffold/. .
          rm -rf test

      - name: Set minSdk to 21
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle* || true

      - run: flutter pub get

      # One APK per CPU type. Most older head units want the armeabi-v7a one.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: now-playing-apks
          path: build/app/outputs/flutter-apk/*.apk
