name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev', 'development', 'codex/**', 'vybe/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: now_playing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Generate Flutter scaffolding
        run: |
          flutter create --org com.conjure --project-name now_playing /tmp/scaffold
          cp -rn /tmp/scaffold/. .
          rm -rf test

      - name: Set minSdk to 21
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle* || true

      - name: Install Android NDK with retry
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' < /dev/null && break
            echo "NDK installation attempt $attempt failed; clearing partial download"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 15
          done
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Generate experimental branded Android launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          svg = Path('assets/vybe_edgy_icon.svg').read_bytes()
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              output = Path('android/app/src/main/res') / ('mipmap-' + density) / 'ic_launcher.png'
              output.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(bytestring=svg, write_to=str(output), output_width=size, output_height=size)
          PY

      - run: flutter pub get

      # Each APK needs a monotonically increasing Android versionCode. Without
      # this, the package installer may treat successive builds as identical.
      # Note: updating in place also requires the SAME signing certificate
      # across builds. The scaffold's default debug signing is ephemeral on
      # GitHub-hosted runners; configure persistent release signing before
      # relying on installs over an existing app.
      - name: Build versioned APKs
        run: |
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "Building VYBE Android versionCode=$BUILD_CODE"
          flutter build apk --release --split-per-abi --build-number="$BUILD_CODE"

      - name: Explain signing limitation
        run: |
          echo "::warning::Generated Flutter scaffold uses a runner-local debug signing key unless release signing is configured. APKs signed by different runs cannot update each other in place. Configure persistent signing credentials for upgrade installs."
          echo "### APK installation compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_STEP_SUMMARY"
          echo "In-place upgrades also require the same signing certificate across builds; generated runner debug keys are not stable." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: now-playing-apks
          path: now_playing/build/app/outputs/flutter-apk/*.apk
