name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev', 'development', 'codex/**', 'vybe/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: now_playing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Verify complete VYBE source is restored
        run: |
          set -euo pipefail
          EXPECTED_ANCESTOR=c8cc45e7254b65af2f4295007d9a43126bb4a5ff
          git merge-base --is-ancestor "$EXPECTED_ANCESTOR" HEAD || {
            echo "::error::WRONG SOURCE BRANCH! Expected full-featured VYBE #851 lineage."
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'lib/music_video_theme.dart': ['class MusicVideoTheme extends StatefulWidget', 'onToggleUtilityMenu', 'Future<String> _findVideo()'],
              'lib/portable_media_cache.dart': ['class PortableMediaCache'],
              'lib/media_cache.dart': ['class MediaCache'],
              'lib/coverflow_theme.dart': ['class CoverflowScene extends StatelessWidget'],
              'lib/riot_fixed_spacing.dart': ['riotFixedPairOffsets'],
              'lib/vybe_link.dart': ['class VybeLink extends ChangeNotifier'],
              'lib/now_playing_screen.dart': ['MusicVideoTheme('],
              'assets/vybe_edgy_icon.svg': [],
              'assets/fonts/VYBE_Riot.ttf': [],
          }
          missing = []
          for name, markers in checks.items():
              path = Path(name)
              if not path.is_file():
                  missing.append(name + ' (missing)')
                  continue
              if markers:
                  source = path.read_text()
                  for marker in markers:
                      if marker not in source:
                          missing.append(name + ' missing ' + marker)
          if missing:
              raise SystemExit('Wrong/partial VYBE source: ' + '; '.join(missing))
          print('RESTORE VALIDATED: Music Video, saved-art cache, Coverflow, 165 Riot pairs, Connect, branded launcher')
          PY
          echo "### SOURCE VERIFIED: FULL-FEATURED VYBE" >> "$GITHUB_STEP_SUMMARY"
          echo "Restored from working Music Video source commit \`c8cc45e7254b65af2f4295007d9a43126bb4a5ff\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight checked video, cache, Coverflow, Riot, Connect, edgy logo." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Flutter scaffolding
        run: |
          flutter create --org com.conjure --project-name now_playing /tmp/scaffold
          cp -rn /tmp/scaffold/. .
          rm -rf test

      - name: Set minSdk to 21
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle* || true

      - name: Install permanent VYBE release signing
        env:
          VYBE_SIGNING_KEYSTORE_BASE64: ${{ secrets.VYBE_SIGNING_KEYSTORE_BASE64 }}
          VYBE_SIGNING_PASSWORD: ${{ secrets.VYBE_SIGNING_PASSWORD }}
          VYBE_SIGNING_KEY_ALIAS: ${{ secrets.VYBE_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          def fail(message):
              raise SystemExit("::error::" + message)

          def clean_secret(name):
              raw = os.environ.get(name, "").strip()
              # Also accept the full NAME=VALUE line from the supplied TXT,
              # in case that was copied instead of the right-hand value.
              prefix = name + "="
              if raw.startswith(prefix):
                  raw = raw[len(prefix):].strip()
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ('"', "'"):
                  raw = raw[1:-1].strip()
              return raw

          encoded = re.sub(r"\s+", "", clean_secret("VYBE_SIGNING_KEYSTORE_BASE64"))
          password = clean_secret("VYBE_SIGNING_PASSWORD")
          alias = clean_secret("VYBE_SIGNING_KEY_ALIAS")
          if not encoded:
              fail("VYBE_SIGNING_KEYSTORE_BASE64 is missing or empty.")
          if not password:
              fail("VYBE_SIGNING_PASSWORD is missing or empty.")
          if not alias:
              fail("VYBE_SIGNING_KEY_ALIAS is missing or empty.")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", password):
              fail("Signing password contains unexpected characters; copy the single VALUE from the credentials TXT.")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", alias):
              fail("Signing alias contains unexpected characters; copy the single VALUE from the credentials TXT.")

          try:
              key_bytes = base64.b64decode(encoded, validate=True)
          except Exception:
              fail("VYBE_SIGNING_KEYSTORE_BASE64 is not valid Base64. Recopy the full long encoded value.")
          expected_file_sha = "2b46132bded1ea9fe00b67693a1140b7a64096b06545d8074683e670b941cf76"
          if hashlib.sha256(key_bytes).hexdigest() != expected_file_sha:
              fail("Encoded keystore doesn't match the VYBE key supplied earlier; re-copy the entire Base64 value.")

          keystore = (Path.cwd() / "android/app/vybe-release.jks").resolve()
          keystore.write_bytes(key_bytes)
          keystore.chmod(0o600)

          check = subprocess.run(
              ["keytool", "-list", "-keystore", str(keystore), "-storepass",
               password, "-alias", alias], stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL)
          if check.returncode != 0:
              fail("Keystore file is valid but signing PASSWORD or KEY ALIAS does not match. Recheck both GitHub secrets against the TXT.")

          cert = subprocess.run(
              ["keytool", "-exportcert", "-keystore", str(keystore),
               "-storepass", password, "-alias", alias],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          expected_cert = "703D48356F0E4D9211FCB9C863E9536B96CF47C6450B0E3338FC42BC7A7B908D"
          if cert.returncode != 0 or hashlib.sha256(cert.stdout).hexdigest().upper() != expected_cert:
              fail("Signing certificate fingerprint mismatch; build blocked to preserve update compatibility.")

          props = Path("android/key.properties")
          props.write_text("storePassword=" + password + "\n" +
                           "keyPassword=" + password + "\n" +
                           "keyAlias=" + alias + "\n" +
                           "storeFile=" + str(keystore) + "\n", encoding="utf-8")
          props.chmod(0o600)
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.is_file():
              fail("Expected Flutter Kotlin Android Gradle file missing.")
          content = gradle.read_text(encoding="utf-8")
          if (content.count('signingConfig = signingConfigs.getByName("debug")') != 1 or
                  content.count("android {") != 1 or content.count("    buildTypes {") != 1):
              fail("Unexpected Gradle signing configuration: no unsafe debug fallback.")
          content = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + content
          content = content.replace('android {',
              'val vybeSigning = Properties()\n' +
              'vybeSigning.load(FileInputStream(rootProject.file("key.properties")))\n\n' +
              'android {', 1)
          content = content.replace('    buildTypes {',
              '    signingConfigs {\n' +
              '        create("release") {\n' +
              '            keyAlias = vybeSigning.getProperty("keyAlias")\n' +
              '            keyPassword = vybeSigning.getProperty("keyPassword")\n' +
              '            storeFile = file(vybeSigning.getProperty("storeFile"))\n' +
              '            storePassword = vybeSigning.getProperty("storePassword")\n' +
              '        }\n' +
              '    }\n\n    buildTypes {', 1)
          content = content.replace('signingConfig = signingConfigs.getByName("debug")',
                                    'signingConfig = signingConfigs.getByName("release")', 1)
          gradle.write_text(content, encoding="utf-8")
          print("Permanent VYBE certificate and release Gradle signing verified.")
          PY

      - name: Install Android NDK with retry
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' < /dev/null && break
            echo "NDK installation attempt $attempt failed; clearing partial download"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 15
          done
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Generate experimental branded Android launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          svg = Path('assets/vybe_edgy_icon.svg').read_bytes()
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              output = Path('android/app/src/main/res') / ('mipmap-' + density) / 'ic_launcher.png'
              output.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(bytestring=svg, write_to=str(output), output_width=size, output_height=size)
          PY

      - name: Normalize VYBE Riot glyph side bearings
        run: |
          python3 -m pip install --quiet fonttools
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          path = Path('assets/fonts/VYBE_Riot.ttf')
          font = TTFont(path)
          glyf = font['glyf']
          metrics = font['hmtx'].metrics
          # Trim invisible padding around outlined glyphs. This is uniform
          # across the alphabet, not a list of word-specific kerning hacks.
          for name in font.getGlyphOrder():
              glyph = glyf[name]
              if glyph.isComposite() or glyph.numberOfContours <= 0:
                  continue
              glyph.recalcBounds(glyf)
              width = glyph.xMax - glyph.xMin
              if width <= 0:
                  continue
              dx = 8 - glyph.xMin
              coords, end_pts, flags = glyph.getCoordinates(glyf)
              for i in range(len(coords)):
                  x, y = coords[i]
                  coords[i] = (x + dx, y)
              glyph.coordinates = coords
              glyph.recalcBounds(glyf)
              metrics[name] = (width + 16, 8)
          font.save(path)
          print('VYBE Riot: normalized outlined glyphs to 8-unit side bearings')
          PY

      - name: Build expanded VYBE Riot Unicode glyphs
        run: |
          python3 -m pip install --quiet lxml
          python3 tools/extend_riot_font.py

      - run: flutter pub get

      # A permanent certificate plus a monotonically increasing Android
      # versionCode permits normal update installs without deleting app data.
      - name: Build versioned APKs
        run: |
          BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "Building VYBE Android versionCode=$BUILD_CODE"
          flutter build apk --release --split-per-abi --build-number="$BUILD_CODE"

      - name: Verify release APK signatures before upload
        run: |
          set -euo pipefail
          EXPECTED_CERT="703D48356F0E4D9211FCB9C863E9536B96CF47C6450B0E3338FC42BC7A7B908D"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" || { echo "::error::Missing apksigner"; exit 1; }
          count=0
          for apk in build/app/outputs/flutter-apk/*.apk; do
            test -f "$apk" || continue
            actual="$("$APK_SIGNER" verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              tr '[:lower:]' '[:upper:]' | tr -d '\r')"
            if [ "$actual" != "$EXPECTED_CERT" ]; then
              echo "::error::APK signing certificate mismatch. Refusing to upload $(basename "$apk")."
              exit 1
            fi
            echo "Permanent VYBE release signature OK: $(basename "$apk")"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::No APKs generated"; exit 1; }
          echo "### Permanent VYBE release signature verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified signed APKs: $count" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $EXPECTED_CERT" >> "$GITHUB_STEP_SUMMARY"
          echo "Android versionCode: $((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_STEP_SUMMARY"


      - uses: actions/upload-artifact@v4
        with:
          name: now-playing-apks
          path: now_playing/build/app/outputs/flutter-apk/*.apk
